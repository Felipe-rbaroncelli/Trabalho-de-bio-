><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hide"></div><button class="btn" id="next" disabled>Próxima pergunta →</button></div><div id="result" class="hide" style="text-align:center"><div style="font-size:60px">🏆</div><h2>Quiz concluído!</h2><h1 id="final"></h1><p id="message"></p><button class="btn" onclick="restart()">Refazer quiz</button><button class="btn" style="background:#d3e4ff" onclick="share()">Compartilhar quiz</button></div></main><footer>Material educativo • Síndrome de Turner • Genética humana</footer></div><script>

quipe de saúde."]];let i=0,score=0,selected=false;const el=id=>document.getElementById(id);function render(){selected=false;el('count').textContent='Questão '+(i+1)+' de '+questions.length;el('points').textContent=score+' ponto(s)';el('fill').style.width=(i/questions.length*100)+'%';el('question').textContent=questions[i][0];el('feedback').classList.add('hide');el('next').disabled=true;el('next').textContent=i===questions.length-1?'Ver resultado →':'Próxima pergunta →';el('options').innerHTML='';questions[i][1].forEach((a,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+') '+a;b.onclick=()=>answer(j);el('options').appendChild(b)})}function answer(j){if(selected)return;selected=true;const q=questions[i];if(j===q[2])score++;[...el('options').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});el('feedback').textContent=(j===q[2]?'✅ Correto! ':'❌ Não foi dessa vez. ')+q[3];el('feedback').classList.remove('hide');el('points').textContent=score+' ponto(s)';el('next').disabled=false}el('next').onclick=()=>{i++;if(i<questions.length)render();else{el('game').classList.add('hide');el('result').classList.remove('hide');el('final').textContent=score+' / '+questions.length;el('message').textContent=score>=8?'Excelente! Você domina o assunto.':score>=5?'Bom trabalho! Continue estudando.':'Continue praticando: cada tentativa é uma oportunidade de aprender.'}};function restart(){i=0;score=0;el('game').classList.remove('hide');el('result').classList.add('hide');render()}async function share(){if(navigator.share){try{await navigator.share({title:'Quiz: Síndrome de Turner',url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert('Link copiado!')}catch(e){prompt('Copie o link:',location.href)}}}render();
